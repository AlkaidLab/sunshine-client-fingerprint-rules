name: Publish signed rule feed

on:
  push:
    branches:
      - main
    paths:
      - rules/rules.json
      - certs/rules-signing.pem
      - scripts/publish.py
      - .github/workflows/publish.yml
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: publish-stable-rules
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load signing key
        shell: bash
        env:
          RULE_SIGNING_KEY_PEM: ${{ secrets.RULE_SIGNING_KEY_PEM }}
        run: |
          test -n "${RULE_SIGNING_KEY_PEM}"
          printf '%s' "${RULE_SIGNING_KEY_PEM}" > "${RUNNER_TEMP}/rules-signing-key.pem"
          chmod 600 "${RUNNER_TEMP}/rules-signing-key.pem"

      - name: Generate and verify signed feed
        env:
          RULE_SIGNING_KEY_FILE: ${{ runner.temp }}/rules-signing-key.pem
        run: python scripts/publish.py

      - name: Commit generated feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision.txt payload.json stable.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "publish signed rule feed [skip ci]"
          git push
